<span class="estado {% if estado == 'Pendiente' %}estado-pendiente{% elif estado == 'Confirmado' %}estado-confirmado{% elif estado == 'Finalizado' %}estado-finalizado{% else %}estado-anulado{% endif %}">{{ estado }}</span>{% if vencido %} <span class="estado estado-anulado" title="Pendiente con la fecha pasada: nadie lo confirmó">Vencido</span>{% endif %}{% if en_curso %} <span class="estado estado-confirmado" title="El chofer marcó «Empezamos»"><i class="bi bi-play-fill"></i> En curso</span>{% endif %}{% if atrasada %} <span class="estado estado-anulado" title="Ya tenía que terminar y otra mudanza la espera"><i class="bi bi-alarm"></i> Atrasada</span>{% elif para_finalizar %} <span class="estado estado-pendiente" title="La mudanza ya empezó: falta finalizarla">Para finalizar</span>{% endif %}
